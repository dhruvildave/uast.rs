name: Cargo Build & Test

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"
          cargo build --verbose
          cargo test --verbose
